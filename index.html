<script>
/* ================= STATE & CONSTANTS ================= */
const C={o:'#FD5108',o2:'#FE7C39',o3:'#FFAA72',d:'#2D2D2D',g:'#9ca3af',r:'#E0301E',gr:'#10b981',am:'#f59e0b'};
const COMP={base:C.d,allow:C.o,bonus:C.o3,ben:C.g};
const S={grades:[],emps:[],pop:'All',pStruct:50,pBench:50,pGrade:50,sel:0,tab:'dash',dm:'cost',chip:'All',node:null,est:false,
  tb:{pct:50,bw:50,gap:20,allowPct:100,benPct:100,bonusDelta:0,onCost:12,attrRed:3,repl:50,phase:1}};
const PRESETS={'Conservative':{pct:40,bw:50,gap:0,allowPct:90,benPct:90,bonusDelta:0},'Market-aligned':{pct:50,bw:50,gap:20,allowPct:100,benPct:100,bonusDelta:0},'Competitive':{pct:60,bw:60,gap:30,allowPct:105,benPct:105,bonusDelta:2}};
let G=[],E=[],K={},charts={};
const MODS=[['dash','Dashboard','M4 5a1 1 0 011-1h5v7H4V5zm10-1h5a1 1 0 011 1v3h-6V4zM4 13h6v7H5a1 1 0 01-1-1v-6zm10-3h6v9a1 1 0 01-1 1h-5V10z'],
 ['struct','Pay structure','M4 20V10m6 10V4m6 16v-7m4 7H2'],
 ['rewards','Total rewards','M12 8c-3 0-6-1-6-2.5S9 3 12 3s6 1 6 2.5S15 8 12 8zM6 5.5v4C6 11 9 12 12 12s6-1 6-2.5v-4M6 9.5v4C6 15 9 16 12 16s6-1 6-2.5v-4M6 13.5v4C6 19 9 20 12 20s6-1 6-2.5v-4'],
 ['bench','Benchmark','M3 17l6-6 4 4 8-8M15 7h6v6'],
 ['work','Workspace','M12 3v4m0 0H5v4m7-4h7v4M3 11h4v4H3zm14 0h4v4h-4zM10 3h4v4h-4z'],
 ['grade','Grade analysis','M12 3l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 16l9 5 9-5'],
 ['tobe','To-be design','M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4'],
 ['impact','Financial impact','M12 3v18m4-14h-5a3 3 0 000 6h2a3 3 0 010 6H8']];
const TITLES={dash:'Dashboard',struct:'Pay structure diagnostic',rewards:'Total rewards diagnostic',bench:'Market benchmarking',work:'Workspace',grade:'Grade analysis',tobe:'To-be design',impact:'Financial impact'};

/* ================= HELPERS ================= */
const sum=a=>a.reduce((x,y)=>x+y,0), avg=a=>a.length?sum(a)/a.length:0;
const fmt=n=>(n==null||isNaN(n))?'-':Math.round(n).toLocaleString();
const fm=n=>{if(n==null||isNaN(n))return '-';const a=Math.abs(n);return (n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(1)+'K':Math.round(a))};
const pc=(n,d=1)=>(n==null||isNaN(n))?'-':n.toFixed(d)+'%';
const sgn=(n,f=fm)=>(n>=0?'+':'')+f(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function quant(s,p){if(!s.length)return 0;const i=(s.length-1)*p/100,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)}
function corr(x,y){const n=x.length;if(n<4)return null;const mx=avg(x),my=avg(y);let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2}return b&&c?a/Math.sqrt(b*c):null}
function mkt(g,p){const pts=[[25,g.p25],[50,g.p50],[75,g.p75],[90,g.p90]];let a=pts[0],b=pts[1];if(p>=50&&p<75){a=pts[1];b=pts[2]}else if(p>=75){a=pts[2];b=pts[3]}return Math.max(0,a[1]+(b[1]-a[1])*(p-a[0])/(b[0]-a[0]))}
function mktPct(g,v){let lo=1,hi=99;for(let i=0;i<30;i++){const m=(lo+hi)/2;mkt(g,m)<v?lo=m:hi=m}return (lo+hi)/2}
const rc=r=>r==null?['No data','bg-gray-100 text-gray-500','#e5e7eb']:r<95?['Lagging','bg-amber-100 text-amber-800','#fde68a']:r>105?['Leading','bg-rose-100 text-rose-800','#fecaca']:['Aligned','bg-emerald-100 text-emerald-800','#bbf7d0'];
const get=k=>k.split('.').reduce((o,p)=>o[p],S);
const SL={};
function sl(key,label,min,max,step,pre='',suf=''){SL[key]={pre,suf};const v=get(key);return `<div><div class="flex justify-between items-center mb-1"><label class="text-xs font-semibold text-gray-700">${label}</label><span id="o-${key}" class="text-xs font-bold bg-pwcOrange text-white px-2 py-0.5 rounded">${pre}${v}${suf}</span></div><input id="i-${key}" type="range" min="${min}" max="${max}" step="${step}" value="${v}" oninput="setS('${key}',+this.value)"></div>`}
function syncOut(k){const v=get(k);document.getElementById('o-'+k).innerText=SL[k].pre+v+SL[k].suf;document.getElementById('i-'+k).value=v}
function setS(k,v){const p=k.split('.'),l=p.pop();p.reduce((o,x)=>o[x],S)[l]=v;syncOut(k);renderAll()}
const cv=(id,title,h='h-72',span='',sub='')=>`<div class="card ${span}"><div class="h3">${title}${sub?` <span class="sub">${sub}</span>`:''}</div><div class="relative ${h}"><canvas id="${id}"></canvas></div></div>`;
const kpi=(l,v,s='',col='')=>`<div class="card"><span class="lbl">${l}</span><p class="text-2xl font-black mt-1 ${col||'text-pwcDark'}">${v}</p>${s?`<p class="text-[11px] text-gray-400 mt-0.5">${s}</p>`:''}</div>`;
function table(id,heads,rows){document.getElementById(id).innerHTML=`<thead><tr class="bg-gray-50 text-gray-700 border-b border-gray-200 font-bold">${heads.map(h=>`<th class="p-3">${h}</th>`).join('')}</tr></thead><tbody class="divide-y divide-gray-100 text-gray-600">${rows.map(r=>`<tr class="hover:bg-gray-50">${r.map((c,i)=>`<td class="p-3 ${i==0?'font-bold text-pwcDark':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody>`}
const tw=(id,title,sub='')=>`<div class="card p-0 overflow-hidden"><div class="px-5 py-3 border-b border-gray-100 h3 mb-0">${title} <span class="sub">${sub}</span></div><div class="overflow-x-auto"><table class="w-full text-left text-xs" id="${id}"></table></div></div>`;
function chart(id,cfg){if(charts[id])charts[id].destroy();cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}},cfg.options||{});charts[id]=new Chart(document.getElementById(id),cfg)}
const ySc=(t,x={})=>({y:Object.assign({beginAtZero:true,title:{display:!!t,text:t}},x)});
const stk=(t,x={})=>({x:{stacked:true},y:Object.assign({stacked:true,beginAtZero:true,title:{display:!!t,text:t}},x)});
const line=(label,data,color,x={})=>Object.assign({type:'line',label,data,borderColor:color,backgroundColor:color,tension:.25,pointRadius:3,order:1},x);
const rangeBars=(a,color,label)=>({type:'bar',label,data:a,backgroundColor:color,borderRadius:3,order:2});

/* ================= SAMPLE DATA ================= */
function sampleData(){
  const grades=[
    {grade:'Grade 1',min:45000,max:75000,p25:48000,p50:62000,p75:78000,p90:90000,mAllow:6000,mBonus:5,mBen:9000},
    {grade:'Grade 2',min:70000,max:120000,p25:75000,p50:98000,p75:125000,p90:145000,mAllow:12000,mBonus:8,mBen:15000},
    {grade:'Grade 3',min:110000,max:190000,p25:118000,p50:152000,p75:195000,p90:225000,mAllow:22000,mBonus:10,mBen:24000},
    {grade:'Grade 4',min:175000,max:300000,p25:185000,p50:240000,p75:310000,p90:360000,mAllow:40000,mBonus:15,mBen:38000},
    {grade:'Grade 5',min:275000,max:480000,p25:295000,p50:380000,p75:490000,p90:560000,mAllow:70000,mBonus:25,mBen:60000}];
  const roles={'Grade 1':[['Associate',.35,10],['Coordinator',.5,8]],'Grade 2':[['Analyst',.4,12],['Senior Associate',.6,10]],'Grade 3':[['Assistant Manager',.45,14],['Senior Analyst',.6,10],['Specialist',.8,8]],'Grade 4':[['Manager',.5,14],['Lead Specialist',.75,9]],'Grade 5':[['Senior Manager',.5,10],['Director',.72,8]]};
  const bp={'Grade 1':.05,'Grade 2':.08,'Grade 3':.10,'Grade 4':.15,'Grade 5':.25}, aF={'Grade 1':1.1,'Grade 2':.9,'Grade 3':.78,'Grade 4':1.0,'Grade 5':1.08}, bF={'Grade 1':1,'Grade 2':1.05,'Grade 3':.85,'Grade 4':.95,'Grade 5':1.1};
  const fns=['Finance','Sales','Operations','Technology'];
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const emps=[];let id=1000;
  grades.forEach(g=>roles[g.grade].forEach(([role,base,n])=>{for(let i=0;i<n;i++){
    const gender=rnd()<.5?'F':'M', ten=Math.round(rnd()*150)/10;
    let pos=base+(rnd()-.5)*.4+ten*.008-(gender==='F'&&g.grade==='Grade 3'?.07:0);
    if(rnd()<.08)pos=rnd()<.5?-.08-rnd()*.1:1.05+rnd()*.12;
    const b=Math.round((g.min+(g.max-g.min)*pos)/500)*500;
    const at=rnd()<.06?0:g.mAllow*aF[g.grade]*(.8+rnd()*.4), bn=g.mBen*bF[g.grade]*(.85+rnd()*.3);
    emps.push({id:'E'+(id++),grade:g.grade,role,fn:fns[Math.floor(rnd()*4)],gender,ten,base:b,hous:Math.round(at*.6),trans:Math.round(at*.25),oth:Math.round(at*.15),bpct:bp[g.grade],bonus:Math.round(b*bp[g.grade]*(.5+rnd()*.9)),med:Math.round(bn*.4),ret:Math.round(bn*.35),ins:Math.round(bn*.15),obn:Math.round(bn*.1)});}}));
  return{grades,emps};
}
function prep(emps){emps.forEach(e=>{e.allow=e.hous+e.trans+e.oth;e.ben=e.med+e.ret+e.ins+e.obn;e.tcc=e.base+e.allow+e.bonus+e.ben})}

/* ================= ANALYTICS ENGINE ================= */
function derive(){
  E=S.emps.filter(e=>S.pop==='All'||e.fn===S.pop);
  G=S.grades.slice().sort((a,b)=>a.min-b.min).map(g=>({...g}));
  G.forEach((g,i)=>{
    const n=G[i+1];g.mid=(g.min+g.max)/2;g.bw=(g.max-g.min)/g.min*100;
    g.ovl=n?Math.max(0,(g.max-n.min)/(g.max-g.min)*100):null;g.prog=i?(g.mid/G[i-1].mid-1)*100:null;
    g.e=E.filter(e=>e.grade===g.grade);g.hc=g.e.length;g.sal=g.e.map(e=>e.base).sort((a,b)=>a-b);
    const av=f=>avg(g.e.map(f));
    g.avg=av(e=>e.base);g.aAllow=av(e=>e.allow);g.aBonus=av(e=>e.bonus);g.aBen=av(e=>e.ben);g.aTcc=av(e=>e.tcc);
    g.aHous=av(e=>e.hous);g.aTrans=av(e=>e.trans);g.aOth=av(e=>e.oth);g.aMed=av(e=>e.med);g.aRet=av(e=>e.ret);g.aIns=av(e=>e.ins);g.aObn=av(e=>e.obn);
    g.compa=g.hc?g.avg/g.mid*100:null;g.pen=g.hc?avg(g.e.map(e=>(e.base-g.min)/(g.max-g.min)*100)):null;
    g.below=g.e.filter(e=>e.base<g.min).length;g.above=g.e.filter(e=>e.base>g.max).length;
    g.bPct=g.hc?av(e=>e.bpct)*100:null;const tg=sum(g.e.map(e=>e.base*e.bpct));g.payout=tg?sum(g.e.map(e=>e.bonus))/tg*100:null;
    g.mTcc=g.p50+g.mAllow+g.p50*g.mBonus/100+g.mBen;
    const f=g.e.filter(e=>e.gender==='F').map(e=>e.base),m=g.e.filter(e=>e.gender==='M').map(e=>e.base);
    g.gap=f.length>=2&&m.length>=2?(avg(m)-avg(f))/avg(m)*100:null;
    g.tcor=corr(g.e.map(e=>e.ten),g.e.map(e=>e.base));
    g.mp=g.hc?mktPct(g,g.avg):null;
  });
  const t=f=>sum(E.map(f)),hc=E.length;
  K={hc,base:t(e=>e.base),allow:t(e=>e.allow),bonus:t(e=>e.bonus),ben:t(e=>e.ben),tcc:t(e=>e.tcc)};
  K.avgBase=hc?K.base/hc:0;K.avgTcc=hc?K.tcc/hc:0;K.medTcc=quant(E.map(e=>e.tcc).sort((a,b)=>a-b),50);
  K.out=sum(G.map(g=>g.below+g.above));K.ten=avg(E.map(e=>e.ten));
  const tg=sum(E.map(e=>e.base*e.bpct));K.payout=tg?K.bonus/tg*100:null;
  const w=G.filter(g=>g.gap!=null);K.gap=w.length?sum(w.map(g=>g.gap*g.hc))/sum(w.map(g=>g.hc)):null;
  K.baseVs=hc?sum(G.map(g=>g.avg*g.hc))/sum(G.map(g=>g.p50*g.hc))*100:null;
  K.tccVs=hc?sum(G.map(g=>g.aTcc*g.hc))/sum(G.map(g=>g.mTcc*g.hc))*100:null;
  const cr=(a,b)=>hc?sum(G.map(g=>g[a]*g.hc))/sum(G.map(g=>g[b]*g.hc))*100:null;
  K.allowVs=cr('aAllow','mAllow');K.benVs=cr('aBen','mBen');
  K.bonusVs=hc?sum(G.map(g=>(g.bPct||0)*g.hc))/sum(G.map(g=>g.mBonus*g.hc))*100:null;
}

function toBe(over){
  const p=Object.assign({},S.tb,over);let any=0;
  const T=G.map(g=>{
    const mid=mkt(g,p.pct),min=mid*2/(2+p.bw/100),max=min*(1+p.bw/100);
    const aT=g.mAllow*p.allowPct/100,bT=g.mBen*p.benPct/100,tp=Math.max(0,(g.mBonus+p.bonusDelta)/100),po=(g.payout==null?100:g.payout)/100;
    const t={g,mid,min,max,nb:0,na:0,cB:0,cA:0,cBo:0,cBe:0,nB:0,nA:0,nBo:0,nBe:0};
    g.e.forEach(e=>{
      let b=e.base;if(b<min)b=min;if(b<mid)b+=(mid-b)*p.gap/100;if(b>max&&e.base<=max)b=max;
      const dB=b-e.base,dA=Math.max(0,aT-e.allow),dBo=Math.max(0,b*tp*po-e.bonus),dBe=Math.max(0,bT-e.ben);
      if(e.base<min)t.nb++;if(e.base>max)t.na++;
      t.cB+=dB;t.cA+=dA;t.cBo+=dBo;t.cBe+=dBe;
      if(dB>.5)t.nB++;if(dA>.5)t.nA++;if(dBo>.5)t.nBo++;if(dBe>.5)t.nBe++;if(dB+dA+dBo+dBe>.5)any++;
    });
    t.cOn=p.onCost/100*(t.cB+t.cA+t.cBo);
    t.asTcc=sum(g.e.map(e=>e.tcc));t.asCtc=t.asTcc+p.onCost/100*sum(g.e.map(e=>e.base+e.allow+e.bonus));
    t.inc=t.cB+t.cA+t.cBo+t.cBe;t.toTcc=t.asTcc+t.inc;t.toCtc=t.asCtc+t.inc+t.cOn;
    return t;});
  T.forEach((t,i)=>{const n=T[i+1];t.ovl=n?Math.max(0,(t.max-n.min)/(t.max-t.min)*100):null;t.prog=i?(t.mid/T[i-1].mid-1)*100:null});
  const s=f=>sum(T.map(f));
  const tot={cB:s(t=>t.cB),cA:s(t=>t.cA),cBo:s(t=>t.cBo),cBe:s(t=>t.cBe),cOn:s(t=>t.cOn),nB:s(t=>t.nB),nA:s(t=>t.nA),nBo:s(t=>t.nBo),nBe:s(t=>t.nBe),asTcc:s(t=>t.asTcc),asCtc:s(t=>t.asCtc),toCtc:s(t=>t.toCtc),aff:any,nb:s(t=>t.nb),na:s(t=>t.na)};
  tot.inc=tot.cB+tot.cA+tot.cBo+tot.cBe;tot.incCtc=tot.inc+tot.cOn;tot.toTcc=tot.asTcc+tot.inc;
  tot.save=K.hc*p.attrRed/100*p.repl/100*K.avgBase;
  return{T,tot,p};
}

/* ================= EXCEL IMPORT / EXPORT ================= */
const key=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const pick=(o,ns)=>{for(const n of ns)if(o[n]!==undefined&&o[n]!=='')return o[n]};
const num=v=>{if(v===undefined)return;const n=Number(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?undefined:n};
const normRows=ws=>XLSX.utils.sheet_to_json(ws,{defval:''}).map(r=>{const o={};Object.keys(r).forEach(k=>o[key(k)]=r[k]);return o});
function setPopOptions(){const f=[...new Set(S.emps.map(e=>e.fn))].sort();const el=document.getElementById('pop');el.innerHTML=['All',...f].map(x=>`<option>${esc(x)}</option>`).join('');S.pop='All'}

function handleExcelImport(ev){
  const file=ev.target.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}),names=wb.SheetNames;
    const gs=names.find(n=>/grade|band|struct|range/i.test(n))||names[0];
    const es=names.find(n=>/emp|staff|people|roster|incumb/i.test(n))||(names.length>1?names.find(n=>n!==gs):null);
    let est=false;
    const grades=normRows(wb.Sheets[gs]).map((r,i)=>{
      const min=num(pick(r,['min','minimum','rangemin','minsalary'])),max=num(pick(r,['max','maximum','rangemax','maxsalary']));if(min==null||max==null||max<=min)return null;
      const mid=(min+max)/2,p50=num(pick(r,['marketp50','p50','marketmedian','mktp50']))??mid;
      let bn=num(pick(r,['marketbonustargetpct','marketbonuspct','marketbonus','marketbonustarget']));if(bn!=null&&bn<=1)bn*=100;
      const ma=num(pick(r,['marketallowancesp50','marketallowances','marketallowance'])),mb=num(pick(r,['marketbenefitsp50','marketbenefits']));
      if(ma==null||bn==null||mb==null)est=true;
      return{grade:String(pick(r,['grade','level','band','jobgrade'])??('Grade '+(i+1))).trim(),min,max,p25:num(pick(r,['marketp25','p25','mktp25']))??mid*.88,p50,p75:num(pick(r,['marketp75','p75','mktp75']))??mid*1.12,p90:num(pick(r,['marketp90','p90','mktp90']))??mid*1.25,mAllow:ma??p50*.1,mBonus:bn??10,mBen:mb??p50*.12};
    }).filter(Boolean);
    if(!grades.length){alert('No valid grades found. The grades sheet needs Grade, Min and Max columns.');return}
    let emps=[];
    if(es&&es!==gs)emps=normRows(wb.Sheets[es]).map((r,i)=>{
      let bp=num(pick(r,['bonustargetpct','bonustarget','targetbonus','bonustargetpercent']))||0;if(bp>1)bp/=100;
      const at=num(pick(r,['allowances','totalallowances'])),bt=num(pick(r,['benefits','totalbenefits']));
      const h=num(pick(r,['housingallowance','housing','hra'])),tr=num(pick(r,['transportallowance','transport'])),o=num(pick(r,['otherallowance','otherallowances']));
      const hasA=h!=null||tr!=null||o!=null;
      return{id:String(pick(r,['employeeid','empid','id','employee','name'])??('E'+(i+1))),grade:String(pick(r,['grade','level','band'])??'').trim(),role:String(pick(r,['role','designation','title','jobtitle','position'])??'Unspecified').trim(),fn:String(pick(r,['function','department','businessunit'])??'All staff').trim(),
        gender:String(pick(r,['gender','sex'])??'').trim().charAt(0).toUpperCase(),ten:num(pick(r,['tenureyears','tenure','yearsofservice']))??0,base:num(pick(r,['basesalary','base','salary','basepay','annualsalary'])),
        hous:h??0,trans:tr??0,oth:hasA?(o??0):(at??0),bpct:bp,bonus:num(pick(r,['bonusactual','bonus','bonuspaid','actualbonus']))??0,
        med:num(pick(r,['medical','healthinsurance']))??0,ret:num(pick(r,['retirement','pension','providentfund']))??0,ins:num(pick(r,['insurance','lifeinsurance']))??0,obn:num(pick(r,['otherbenefits']))??(bt??0)};
    }).filter(x=>x.base!=null&&grades.some(g=>g.grade===x.grade));
    prep(emps);S.grades=grades;S.emps=emps;S.est=est;S.sel=0;S.node=null;setPopOptions();
    document.getElementById('data-status').innerText=`${file.name} (${grades.length} grades, ${emps.length} employees)`;
    renderAll();
  }catch(err){console.error(err);alert('Could not read this file. Please use the template format (.xlsx, .xls or .csv).')}ev.target.value=''};
  rd.readAsArrayBuffer(file);
}
function downloadTemplate(){
  const d=sampleData(),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.grades.map(g=>({Grade:g.grade,Min:g.min,Max:g.max,MarketP25:g.p25,MarketP50:g.p50,MarketP75:g.p75,MarketP90:g.p90,MarketAllowancesP50:g.mAllow,MarketBonusTargetPct:g.mBonus,MarketBenefitsP50:g.mBen}))),'Grades');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.emps.map(e=>({EmployeeID:e.id,Grade:e.grade,Role:e.role,Function:e.fn,Gender:e.gender,TenureYears:e.ten,BaseSalary:e.base,HousingAllowance:e.hous,TransportAllowance:e.trans,OtherAllowance:e.oth,BonusTargetPct:e.bpct*100,BonusActual:e.bonus,Medical:e.med,Retirement:e.ret,Insurance:e.ins,OtherBenefits:e.obn}))),'Employees');
  XLSX.writeFile(wb,'rewards-template.xlsx');
}
function exportResults(){
  const X=toBe(),wb=XLSX.utils.book_new(),r1=v=>v==null?'':+v.toFixed(1);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(G.map(g=>({Grade:g.grade,Min:g.min,Midpoint:g.mid,Max:g.max,'Bandwidth %':r1(g.bw),'Overlap %':r1(g.ovl),'Progression %':r1(g.prog),Headcount:g.hc,'Avg base':Math.round(g.avg),'Avg allowances':Math.round(g.aAllow),'Avg bonus':Math.round(g.aBonus),'Avg benefits':Math.round(g.aBen),'Avg total rewards':Math.round(g.aTcc),'Compa-ratio %':r1(g.compa),'Bonus payout %':r1(g.payout),'Gender gap %':r1(g.gap),'Market P50':g.p50,'Midpoint vs market P50 %':r1(g.mid/g.p50*100),'Total rewards vs market %':r1(g.hc?g.aTcc/g.mTcc*100:null),'Below min':g.below,'Above max':g.above}))),'As-is diagnostic');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(X.T.map(t=>({Grade:t.g.grade,'To-be min':Math.round(t.min),'To-be mid':Math.round(t.mid),'To-be max':Math.round(t.max),'Base cost':Math.round(t.cB),'Allowance cost':Math.round(t.cA),'Bonus cost':Math.round(t.cBo),'Benefit cost':Math.round(t.cBe),'On-costs':Math.round(t.cOn),'Total incremental':Math.round(t.inc),'As-is CTC':Math.round(t.asCtc),'To-be CTC':Math.round(t.toCtc)}))),'To-be and impact');
  XLSX.writeFile(wb,'rewards-analysis.xlsx');
}

window.onload=()=>{Chart.defaults.font.size=11;Chart.defaults.color='#6b7280';const d=sampleData();prep(d.emps);S.grades=d.grades;S.emps=d.emps;buildShell();setPopOptions();switchTab('dash')};
</script>
